name: Founder skills
on:
  push:
    branches: [main]
    paths:
      - 'founder-skills/**'
      - '.github/workflows/founder-skills.yml'
  pull_request:
    paths:
      - 'founder-skills/**'
      - '.github/workflows/founder-skills.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: founder-skills
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Offline validation
        run: python manage.py validate
      - name: Installation and packaging tests
        run: python -m unittest discover -s tests -v
      - name: Install development YAML validator
        run: python -m pip install PyYAML==6.0.2
      - name: Official creator initialization and format checks
        run: python tools/check_official_creator.py
      - name: Build distributable
        run: python manage.py package --output dist/founder-skills-v1.0.0.zip
      - uses: actions/upload-artifact@v4
        with:
          name: founder-skills-v1.0.0-${{ matrix.os }}
          path: founder-skills/dist/founder-skills-v1.0.0.zip
          if-no-files-found: error
          retention-days: 30
