name: Offline Skill Checks
on: [push, pull_request]
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile helpers
        run: python -m compileall -q scripts
      - name: Offline regressions
        run: python3 scripts/smoke_test.py
      - name: Fixture validator
        run: python3 scripts/validate_plan.py examples/hypothetical-plan.json --allow-fixture
